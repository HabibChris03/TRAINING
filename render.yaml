services:
  - type: web
    name: task-manager-api
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      # Sensitive secrets are marked sync: false so they are configured in cloud dashboard
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
